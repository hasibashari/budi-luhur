<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="192" height="192" fill="none">
  <defs>
    <linearGradient id="pillunaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#e94383"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
    <filter id="pillunaShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#a21caf" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="120" height="120" rx="28" fill="url(#pillunaBg)" filter="url(#pillunaShadow)"/>
  
  <!-- Subtle Internal Highlight Ring -->
  <rect x="2" y="2" width="116" height="116" rx="26" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  
  <!-- Sakura Flower Petals (Backdrop) -->
  <g transform="translate(60, 60)" fill="#ffffff" fill-opacity="0.25">
    <circle cx="0" cy="-24" r="14"/>
    <circle cx="23" cy="-7" r="14"/>
    <circle cx="14" cy="20" r="14"/>
    <circle cx="-14" cy="20" r="14"/>
    <circle cx="-23" cy="-7" r="14"/>
  </g>
  
  <!-- Central Stylized Heart / Blossom Core -->
  <path d="M60 84 C60 84 38 68 38 48 C38 38 46 32 54 32 C58 32 60 35 60 35 C60 35 62 32 66 32 C74 32 82 38 82 48 C82 68 60 84 60 84 Z" fill="#ffffff"/>
  
  <!-- Circular Pill Tablet Symbol -->
  <circle cx="60" cy="54" r="14" fill="#fdf2f8" stroke="#e94383" stroke-width="2.5"/>
  <line x1="50" y1="54" x2="70" y2="54" stroke="#e94383" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Tiny Sakura Accent Flower -->
  <g transform="translate(72, 36) scale(0.65)">
    <circle cx="0" cy="-7" r="4.5" fill="#fbcfe8"/>
    <circle cx="7" cy="-2" r="4.5" fill="#fbcfe8"/>
    <circle cx="4" cy="6" r="4.5" fill="#fbcfe8"/>
    <circle cx="-4" cy="6" r="4.5" fill="#fbcfe8"/>
    <circle cx="-7" cy="-2" r="4.5" fill="#fbcfe8"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>
</svg>
