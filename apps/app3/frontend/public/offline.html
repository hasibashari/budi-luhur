<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#059669">
  <title>PRELUNA | Sedang Offline</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">
  <style>
    :root {
      --primary: #059669;
      --primary-dark: #047857;
      --bg: #fafaf9;
      --text: #0f172a;
      --muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e7e5e4;
      border-radius: 28px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px -15px rgba(5, 150, 105, 0.12);
    }

    .mascot {
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
      display: block;
      border-radius: 24px;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: #ecfdf5;
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
      border-radius: 9999px;
      margin-bottom: 16px;
      border: 1px solid #a7f3d0;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 12px;
    }

    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button,
    a.btn {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #10b981, var(--primary));
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.35);
    }

    .btn-primary:active {
      transform: scale(0.98);
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: #f8fafc;
      color: #334155;
      border: 1px solid #e2e8f0;
    }
  </style>
</head>

<body>
  <div class="card">
    <img src="/icons/icon-192x192.png" alt="PRELUNA Icon" class="mascot">
    <div class="badge">Mode Offline</div>
    <h1>Tidak Ada Koneksi Internet</h1>
    <p>
      Anda sedang offline. Jangan khawatir, jadwal imunisasi TT, kartu kesehatan, dan materi bimbingan pranikah Anda tetap dapat diakses di perangkat ini.
    </p>
    <div class="btn-group">
      <button class="btn-primary" onclick="window.location.reload()">
        🔄 Coba Muat Ulang
      </button>
      <a href="/user/dashboard" class="btn btn-secondary">
        📱 Buka Dashboard Tersimpan
      </a>
    </div>
  </div>
</body>

</html>
